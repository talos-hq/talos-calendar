[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "talos-calendar"
version = "0.2.0"
description = "Pure slot computation and time zone helpers for booking pages."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
dependencies = []

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
talos_calendar = ["py.typed"]
